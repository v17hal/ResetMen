name: reset_app
description: RESET — book a slot, walk in, get scanned in.
publish_to: 'none'

# `+1` is the versionCode. It must increase on every Play upload, and a hand-edited number
# here is the classic way to get a release rejected at 11pm. CI sets it from the tag.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── State and networking ───────────────────────────────────────────────────
  # Riverpod over Provider/Bloc: compile-safe reads, no BuildContext inside repositories,
  # and `ref.invalidate` gives the same "refetch this" ergonomics the two web surfaces get
  # from TanStack Query.
  flutter_riverpod: ^2.6.1
  http: ^1.2.2

  # ── Storage ────────────────────────────────────────────────────────────────
  # Tokens go in the keystore. A refresh token is valid for 30 days, and
  # shared_preferences is plain XML that is world-readable on a rooted device.
  flutter_secure_storage: ^9.2.2
  # Everything else — the offline booking cache that makes check-in work with no signal.
  shared_preferences: ^2.3.4

  # ── UI ─────────────────────────────────────────────────────────────────────
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.1

  # ── Auth and push ──────────────────────────────────────────────────────────
  # All three need `android/app/google-services.json` at build time. That file now exists
  # (project reset-booking-52ee0) — before it did, adding these turned a working build
  # into a broken one, which is why they arrived late.
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # ── Payments ───────────────────────────────────────────────────────────────
  # Kept even though PAYMENTS_ENABLED is off: the store takes money at the counter today,
  # and "can we add online payment?" is the most common thing a shop asks six months in.
  # Takes its key at runtime, so it costs nothing while switched off.
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Fonts are referenced by family name in ResetTokens and fall back to the platform's
  # default until the files are added under assets/fonts. See apps/mobile/README.md —
  # declaring them here before the files exist would fail the build outright.
