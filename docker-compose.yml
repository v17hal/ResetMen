services:
  postgres:
    image: postgres:16-alpine
    container_name: reset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reset
      POSTGRES_PASSWORD: reset
      POSTGRES_DB: reset
    ports:
      - "5432:5432"
    volumes:
      - reset-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reset -d reset"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reset-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - reset-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for Cloudflare R2 (S3-compatible).
  minio:
    image: minio/minio:latest
    container_name: reset-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - reset-miniodata:/data

volumes:
  reset-pgdata:
  reset-redisdata:
  reset-miniodata:
