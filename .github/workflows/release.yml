name: Release

# Tag-driven. `v1.2.3` builds and publishes; nothing else does.
#
# Deliberately not on push-to-main: a deploy should be a decision someone makes, with a
# version number attached, not a side effect of merging.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: What to release
        required: true
        default: both
        type: choice
        options: [both, api, mobile]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.18.1'
  REGISTRY: ghcr.io

jobs:
  # ── Container image for the API and both web surfaces ─────────────────────
  image:
    name: Build and push image
    if: github.event_name == 'push' || inputs.target != 'mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry. A cold build of this monorepo is several minutes,
          # and a deploy that takes ten minutes is a deploy nobody does on a Friday.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Play Store bundle ─────────────────────────────────────────────────────
  mobile:
    name: Build signed app bundle
    if: github.event_name == 'push' || inputs.target != 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The keystore lives in secrets, base64-encoded — a binary cannot be a plain secret.
      # Losing it means the app can never be updated under the same Play listing, so the
      # client keeps the original in their password manager too.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/upload-keystore.jks
          cat > apps/mobile/android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # versionCode must increase on every upload. Deriving it from the run number rather
      # than from pubspec means it cannot be forgotten, and cannot go backwards.
      - name: Set the version from the tag
        working-directory: apps/mobile
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-1.0.0}"
          sed -i "s/^version: .*/version: ${VERSION}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - working-directory: apps/mobile
        run: flutter pub get

      - name: Build the app bundle
        working-directory: apps/mobile
        run: |
          flutter build appbundle --release \
            --dart-define=API_URL=${{ vars.API_URL || 'https://api.resetmen.in' }}

      - uses: actions/upload-artifact@v4
        with:
          name: reset-appbundle-${{ github.ref_name }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      # R8 obfuscates the release build, so a crash in Play Console is unreadable without
      # this file. Uploaded with the bundle, never committed: it maps back to the source.
      - name: Find the mapping file
        id: mapping
        run: |
          MAP=apps/mobile/build/app/outputs/mapping/release/mapping.txt
          [ -f "$MAP" ] && echo "path=$MAP" >> "$GITHUB_OUTPUT" || echo "path=" >> "$GITHUB_OUTPUT"

      # `secrets` cannot be read in a step's `if`, so the presence of the key becomes an
      # output first. Without it the job still builds and keeps the artifact — a missing
      # Play account must not fail a release that is otherwise fine.
      - name: Is Play upload configured?
        id: play
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEY" ]; then echo 'configured=true' >> "$GITHUB_OUTPUT"; else echo 'configured=false' >> "$GITHUB_OUTPUT"; fi

      - name: Upload to Google Play
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.reset.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          mappingFile: ${{ steps.mapping.outputs.path }}
          # Internal testing by default: it reaches testers within minutes and needs no
          # review, so a bad build never lands in front of a customer. Promote from the
          # Console, or set the PLAY_TRACK variable to `production` deliberately.
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Play upload skipped
        if: steps.play.outputs.configured != 'true'
        run: |
          echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, so nothing was uploaded."
          echo "::notice::The signed bundle is attached to this run as an artifact — see docs/play/README.md."
