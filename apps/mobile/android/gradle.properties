# Flutter's template ships `-Xmx8G -XX:MaxMetaspaceSize=4G`, which asks for 12 GB before
# the OS, the IDE or Docker get a look in. On any 8 GB machine the daemon dies mid-R8 with
# "Native memory allocation (mmap) failed ... G1 virtual space" — a JVM crash, not a
# Gradle error, so the message points nowhere near the cause.
#
# 2 GB is comfortable for R8 on an app this size and leaves the machine usable. CI runners
# have more room but no reason to need it.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel and cached builds. Safe here — one module, no cross-project mutation.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Jetifier rewrites legacy android.support.* references at build time. Nothing in this
# dependency set uses them, and leaving it on scans every artifact on every build for no
# result.
android.enableJetifier=false
