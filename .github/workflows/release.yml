name: Release

# Tag-driven. `v1.2.3` builds and publishes; nothing else does.
#
# Deliberately not on push-to-main: a deploy should be a decision someone makes, with a
# version number attached, not a side effect of merging.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: What to release
        required: true
        default: both
        type: choice
        options: [both, api, mobile]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.18.1'
  REGISTRY: ghcr.io

jobs:
  # ── Container image for the API and both web surfaces ─────────────────────
  image:
    name: Build and push image
    if: github.event_name == 'push' || inputs.target != 'mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry. A cold build of this monorepo is several minutes,
          # and a deploy that takes ten minutes is a deploy nobody does on a Friday.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Play Store bundle ─────────────────────────────────────────────────────
  mobile:
    name: Build signed app bundle
    if: github.event_name == 'push' || inputs.target != 'api'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The keystore lives in secrets, base64-encoded — a binary cannot be a plain secret.
      # Losing it means the app can never be updated under the same Play listing, so the
      # client keeps the original in their password manager too.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/upload-keystore.jks
          cat > apps/mobile/android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # versionCode must increase on every upload. Deriving it from the run number rather
      # than from pubspec means it cannot be forgotten, and cannot go backwards.
      - name: Set the version from the tag
        working-directory: apps/mobile
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-1.0.0}"
          sed -i "s/^version: .*/version: ${VERSION}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - working-directory: apps/mobile
        run: flutter pub get

      - name: Build the app bundle
        working-directory: apps/mobile
        run: |
          flutter build appbundle --release \
            --dart-define=API_URL=${{ vars.API_URL || 'https://api.reset.app' }}

      - uses: actions/upload-artifact@v4
        with:
          name: reset-appbundle-${{ github.ref_name }}
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      # Uploading to Play is left as a manual step until the client's Play Console and
      # service account exist. The bundle above is what gets uploaded; wiring
      # r0adkll/upload-google-play here is a one-line change once they do.
      - name: Note
        run: echo "Bundle built. Upload to Play Console manually until the service account exists."
